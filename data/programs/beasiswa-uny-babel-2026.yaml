id: beasiswa-uny-babel-2026
nama: Beasiswa UNY Kerja Sama Bangka Belitung 2026
jenis: program
kategori: Beasiswa
penyelenggara: Dinas Pendidikan Provinsi Kepulauan Bangka Belitung
ringkasan: Beasiswa S1 atau D4 di Universitas Negeri Yogyakarta bagi lulusan sekolah asal Bangka Belitung dari keluarga kurang mampu.
untuk:
  - Lulusan SMA sederajat asal Kepulauan Bangka Belitung dari keluarga kurang mampu
manfaat:
  - Bantuan Biaya Pendidikan
jenjang:
  - Diploma
  - S1
cakupan:
  level: provinsi
  kode: '19'
tipeGerbang: kategori
syarat:
  - teks: Lulusan SMA, SMK, SMALB, atau MA di Kepulauan Bangka Belitung pada 2024, 2025, atau 2026.
    sumberUrl: https://drupal.dindik.babelprov.go.id/sites/default/files/file_attach/20260616104143PENGUMUMAN%20PEMBUKAAN%20BEASISWA%20UNY%20JALUR%20KERJASAMA%20PEMPROV%20BABEL%202026.pdf
  - teks: Penduduk Kepulauan Bangka Belitung dengan kartu keluarga atau KTP setempat.
    sumberUrl: https://drupal.dindik.babelprov.go.id/sites/default/files/file_attach/20260616104143PENGUMUMAN%20PEMBUKAAN%20BEASISWA%20UNY%20JALUR%20KERJASAMA%20PEMPROV%20BABEL%202026.pdf
  - teks: Berasal dari keluarga kurang mampu dengan bukti KIP, KKS, atau SKTM dan terdaftar pada DTKS sesuai pengumuman.
    sumberUrl: https://drupal.dindik.babelprov.go.id/sites/default/files/file_attach/20260616104143PENGUMUMAN%20PEMBUKAAN%20BEASISWA%20UNY%20JALUR%20KERJASAMA%20PEMPROV%20BABEL%202026.pdf
  - teks: Memiliki kesehatan fisik dan mental yang tidak mengganggu studi, tidak menerima beasiswa lain, serta bersedia menyelesaikan pendidikan sesuai waktu yang ditentukan.
    sumberUrl: https://drupal.dindik.babelprov.go.id/sites/default/files/file_attach/20260616104143PENGUMUMAN%20PEMBUKAAN%20BEASISWA%20UNY%20JALUR%20KERJASAMA%20PEMPROV%20BABEL%202026.pdf
langkah:
  - "Daftar online lewat bit.ly/beasiswababelUNY2026 dan unggah berkas administrasi; pendaftaran dilaksanakan Dinas Pendidikan Provinsi Kepulauan Bangka Belitung (15 sampai 22 Juni 2026)."
  - "Berkas diverifikasi dan diseleksi (23 sampai 30 Juni), termasuk verifikasi kelengkapan berkas ke tempat tinggal pendaftar; hasil seleksi administrasi diumumkan 2 Juli 2026."
  - "Yang lulus administrasi mengunggah berkas ke tautan UNY pada minggu kedua Juli, lalu mengikuti ujian pada minggu ketiga Juli."
  - "Hasil seleksi diumumkan akhir Juli 2026. Jadwal dapat berubah sesuai situasi; proses pendaftaran tidak dipungut biaya."
dokumen:
  - Kartu keluarga atau KTP Kepulauan Bangka Belitung
  - KIP, KKS, atau SKTM sebagai bukti kondisi ekonomi
