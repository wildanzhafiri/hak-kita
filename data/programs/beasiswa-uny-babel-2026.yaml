catatan: Pendaftaran 2026 telah ditutup. Pengumuman membedakan jalur beasiswa dari jalur kerja sama lain; syarat pada entri ini hanya untuk jalur beasiswa. Program studi dan kuota harus dicek pada tabel pengumuman resmi.
