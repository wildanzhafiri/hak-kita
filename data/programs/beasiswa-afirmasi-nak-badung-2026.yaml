ringkasan: Bantuan biaya pendidikan tinggi bagi mahasiswa dari keluarga berpenghasilan terbatas di Kabupaten Badung.
untuk:
  - Mahasiswa baru S1, D4, atau program profesi dari Kabupaten Badung
