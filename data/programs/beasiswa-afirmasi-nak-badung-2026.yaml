syarat:
  - teks: Usia saat diterima sebagai mahasiswa baru paling tinggi 21 tahun untuk S1 atau D4, atau 25 tahun untuk program profesi.
    sumberUrl: https://beasiswa.badungkab.go.id/
  - teks: Belum pernah menikah dan tidak menikah selama menempuh pendidikan.
    sumberUrl: https://beasiswa.badungkab.go.id/
  - teks: Pendapatan kepala keluarga per bulan paling banyak Rp5.000.000.
    sumberUrl: https://beasiswa.badungkab.go.id/
  - teks: Kepala keluarga telah bertempat tinggal berturut-turut di Kabupaten Badung sesuai ketentuan program.
    sumberUrl: https://beasiswa.badungkab.go.id/
  - teks: Telah diterima dan terdaftar sebagai mahasiswa baru, serta tidak menerima beasiswa sejenis dari pihak lain.
    sumberUrl: https://beasiswa.badungkab.go.id/
langkah:
  - Buat akun pada portal resmi Beasiswa Nak Badung.
  - Ajukan Beasiswa Afirmasi dan unggah dokumen yang diminta dalam format PDF.
  - Pantau verifikasi perguruan tinggi, verifikasi tim pengelola, dan penetapan penerima.
dokumen:
  - KTP elektronik mahasiswa dan kepala keluarga serta kartu keluarga
  - Surat pernyataan keterbatasan kemampuan ekonomi bermeterai
  - Surat keterangan bertempat tinggal berturut-turut di Kabupaten Badung
  - Surat keterangan kuliah dan rekening bank aktif atas nama mahasiswa
  - Surat pernyataan bermeterai sesuai format resmi
