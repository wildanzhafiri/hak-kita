syarat:
  - teks: Untuk KK baru karena membentuk keluarga, siapkan buku nikah atau kutipan akta perkawinan, atau surat pernyataan tanggung jawab mutlak sesuai kondisi.
    sumberUrl: https://dukcapil.kemendagri.go.id/page/read/penerbitan-kartu-keluarga-baru-karena-membentuk-keluarga-baru
  - teks: Untuk penggantian kepala keluarga karena meninggal, siapkan kutipan akta kematian dan KK lama.
    sumberUrl: https://dukcapil.kemendagri.go.id/page/read/penerbitan-kartu-keluarga-baru-karena-penggantian-kepala-keluarga-kematian-kepala-keluarga
  - teks: Untuk pisah KK dalam satu alamat, siapkan KK lama; pemohon berusia sekurang-kurangnya 17 tahun atau sudah kawin.
    sumberUrl: https://dukcapil.kemendagri.go.id/page/read/penerbitan-kartu-keluarga-baru-karena-pisah-kk-dalam-1-satu-alamat
  - teks: Untuk perubahan data, siapkan KK lama dan bukti perubahan peristiwa kependudukan atau peristiwa penting.
    sumberUrl: https://dukcapil.kemendagri.go.id/page/read/penerbitan-kartu-keluarga-karena-perubahan-data
  - teks: Untuk KK hilang atau rusak, siapkan surat keterangan kehilangan dari kepolisian atau KK yang rusak.
    sumberUrl: https://dukcapil.kemendagri.go.id/page/read/penerbitan-kartu-keluarga-karena-hilang-rusak
langkah:
  - "Isi formulir F-1.02."
  - "Lampirkan dokumen sesuai keperluan: untuk KK baru karena membentuk keluarga, fotokopi buku nikah, kutipan akta perkawinan, atau kutipan akta perceraian; untuk pisah KK, KK lama; untuk penggantian kepala keluarga karena meninggal, fotokopi akta kematian dan KK lama."
  - "Untuk perubahan data, lampirkan KK lama, isi formulir F-1.06, dan lampirkan fotokopi bukti peristiwa kependudukan atau peristiwa penting. Untuk KK hilang atau rusak, serahkan KK yang rusak atau surat keterangan kehilangan dari kepolisian."
  - "Pada layanan daring, dokumen yang dipindai atau difoto untuk diunggah harus aslinya."
  - "Dinas kependudukan menerbitkan KK baru."
