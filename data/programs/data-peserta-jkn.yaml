catatan: Opsi perubahan FKTP mengikuti segmen kepesertaan; untuk Prajurit TNI dan Polri non PNS hanya anggota keluarga yang dapat mengubah FKTP. Panduan ini tidak menjamin aktivasi kembali peserta nonaktif. Halaman sumber tidak mencantumkan biaya.
