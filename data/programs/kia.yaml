catatan: Untuk kasus pindah datang, KIA diterbitkan satu paket dengan SKPD dan KK. Halaman sumber tidak memuat daftar dokumen lengkap per kondisi. Rujukan ini khusus Sudin Dukcapil Jakarta Pusat. Untuk wilayah lain, periksa Dukcapil sesuai domisili. Halaman sumber tidak mencantumkan biaya maupun lama proses.
