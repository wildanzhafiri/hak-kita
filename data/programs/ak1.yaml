syarat:
  - teks: "Lengkapi profil SIAPkerja: foto setengah badan berpenampilan formal dan rapi, data pribadi, pendidikan, pengalaman kerja, pelatihan atau sertifikat, serta bahasa dan keahlian."
    sumberUrl: https://disnaker.sidoarjokab.go.id/001/1739850815
langkah:
  - Buka siapkerja.kemnaker.go.id, masuk dengan email atau nomor ponsel, atau daftar jika belum punya akun.
  - Masukkan kode OTP yang dikirim lewat SMS atau email, lalu lengkapi profil.
  - Dari beranda, pilih Daftar Pencari Kerja, periksa profil, dan lanjutkan pengajuan kartu.
  - Kirim foto KTP dan email terdaftar ke WhatsApp admin Disnaker sesuai kontak pada halaman sumber; kartu dikirim kembali lewat WhatsApp.
