  level: provinsi
  kode: '15'
tipeGerbang: kategori
syarat:
  - teks: Mahasiswa aktif ber-KTP Provinsi Jambi yang telah duduk di semester III atau lebih.
    sumberUrl: https://beasiswa.jambiprov.go.id/web/
  - teks: IPK memenuhi batas jalur kurang mampu atau prestasi yang berbeda menurut rumpun ilmu eksakta dan sosial pada ketentuan resmi.
    sumberUrl: https://beasiswa.jambiprov.go.id/web/
  - teks: Tidak sedang menerima bantuan dari pihak lain.
    sumberUrl: https://beasiswa.jambiprov.go.id/web/
langkah:
  - "Buka halaman pendaftaran di beasiswa.jambiprov.go.id, masukkan NIK berkode wilayah Provinsi Jambi dan nomor WhatsApp yang aktif, lalu isi formulir."
  - "Gunakan nomor WhatsApp yang benar; jika salah, username dan password login tidak diterima. Gunakan PC atau laptop untuk registrasi, login, dan unggah data."
  - "Login, isi data, dan unggah dokumen sesuai jalur kurang mampu atau berprestasi; jadwal tiap tahap ada di menu Rundown."
  - "Tahap I adalah seleksi administrasi. Pada Tahap II (verifikasi faktual), calon penerima mengirim berkas autentik lewat pos ke PO BOX 2025; data palsu atau tidak benar membuat peserta didiskualifikasi."
  - "Penerima ditetapkan lewat pengumuman penetapan penerima beasiswa Provinsi Jambi."
