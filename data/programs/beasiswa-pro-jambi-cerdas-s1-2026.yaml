catatan: Pendaftaran kedua jalur tahun 2026 telah ditutup. Batas IPK jalur kurang mampu dan prestasi berbeda menurut rumpun ilmu; periksa angka tepatnya di FAQ dan petunjuk teknis resmi sebelum mendaftar pada periode berikutnya.
