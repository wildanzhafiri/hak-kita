langkah:
  - Buka sub-menu Pendaftaran Pelayanan di beranda Mobile JKN.
  - Pilih peserta dan poli yang dituju, lalu tulis keluhan.
  - Ketuk Daftar Pelayanan untuk mendapatkan nomor antrean.
  - Segarkan halaman untuk melihat nomor yang sedang dilayani. Gunakan Batalkan atau Ambil Antrean Baru bila perlu.
