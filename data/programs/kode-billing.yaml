catatan: Pembuatan melalui core billing lama atau Coretax bergantung pada masa atau tahun pajak; kewajiban Wajib Pajak Cabang untuk 2024 dan sebelumnya memakai core billing lama. HAKKITA tidak menghitung pajak terutang.
