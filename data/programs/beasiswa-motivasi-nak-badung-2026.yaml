syarat:
  - teks: Berusia paling tinggi 18 tahun pada 1 Juli saat diterima sebagai siswa baru.
    sumberUrl: https://beasiswa.badungkab.go.id/
  - teks: Kepala keluarga telah bertempat tinggal berturut-turut di Kabupaten Badung sesuai ketentuan program.
    sumberUrl: https://beasiswa.badungkab.go.id/
  - teks: Telah diterima dan terdaftar sebagai siswa di sekolah yang diakui.
    sumberUrl: https://beasiswa.badungkab.go.id/
  - teks: Tidak menerima beasiswa untuk tujuan serupa dari pihak lain dan tidak terdaftar di sekolah yang bekerja sama dengan lembaga pendidikan asing sebagaimana ketentuan resmi.
    sumberUrl: https://beasiswa.badungkab.go.id/
langkah:
  - Buat akun pada portal resmi Beasiswa Nak Badung.
  - Ajukan Beasiswa Motivasi dan unggah dokumen yang diminta dalam format PDF.
  - Pantau verifikasi sekolah, verifikasi tim pengelola, dan penetapan penerima.
dokumen:
  - Akta kelahiran siswa dan kartu keluarga
  - KTP elektronik kepala keluarga dan surat keterangan bertempat tinggal
  - Surat keterangan sekolah
  - Rekening BPD Bali aktif atas nama kepala keluarga untuk siswa
  - Surat pernyataan bermeterai sesuai format resmi
