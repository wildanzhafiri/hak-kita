catatan: Penetapan bukan hak otomatis bagi semua peserta didik yang memenuhi gambaran umum sasaran; proses verifikasi, validasi, dan penetapan penerima dilakukan pemerintah. Jangan kirimkan data pribadi melalui HAKKITA.
