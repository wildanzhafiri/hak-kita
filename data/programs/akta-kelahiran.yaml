id: akta-kelahiran
nama: Pencatatan Kelahiran WNI
jenis: layanan
kategori: "Kependudukan & Dokumen Pribadi"
penyelenggara: Direktorat Jenderal Kependudukan dan Pencatatan Sipil (Dukcapil)
ringkasan: Panduan pencatatan kelahiran WNI di Indonesia dan penerbitan kutipan akta melalui Dukcapil.
untuk:
  - Penduduk WNI yang melaporkan kelahiran
cakupan:
  level: nasional
  kode: ID
tipeGerbang: prosedur
syarat:
  - teks: Menyiapkan surat keterangan kelahiran; bila tidak ada, ikuti ketentuan surat pernyataan tanggung jawab mutlak pada prosedur Dukcapil.
    sumberUrl: https://dukcapil.kemendagri.go.id/page/read/pencatatan-kelahiran-wni-dalam-wilayah-nkri
  - teks: Menyiapkan buku nikah, kutipan akta perkawinan, atau bukti lain sesuai kondisi orang tua yang diatur dalam prosedur.
    sumberUrl: https://dukcapil.kemendagri.go.id/page/read/pencatatan-kelahiran-wni-dalam-wilayah-nkri
  - teks: Menyiapkan Kartu Keluarga tempat anak akan didaftarkan.
    sumberUrl: https://dukcapil.kemendagri.go.id/page/read/pencatatan-kelahiran-wni-dalam-wilayah-nkri
langkah:
  - "Isi formulir F-2.01."
  - "Lampirkan fotokopi surat keterangan kelahiran, fotokopi buku nikah atau kutipan akta perkawinan, dan fotokopi KK. Bila syarat surat keterangan kelahiran atau bukti perkawinan tidak terpenuhi, isi surat pernyataan tanggung jawab mutlak (F-2.03 untuk data kelahiran, F-2.04 untuk status perkawinan) bersama dua orang saksi."
  - "Pada layanan tatap muka, serahkan fotokopi dan perlihatkan dokumen aslinya; pada layanan daring, dokumen yang dipindai atau difoto untuk diunggah harus aslinya."
  - "Fotokopi KTP-el saksi tidak perlu dilampirkan karena identitas saksi sudah tercantum di formulir F-2.01."
  - "Dinas kependudukan menerbitkan kutipan akta kelahiran."
sumberUtama:
