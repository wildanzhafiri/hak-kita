catatan: Jadwal 13 Juli sampai 10 Oktober 2026 pada portal khusus mahasiswa semester 1 dan 2 dan pendaftarannya telah ditutup. Portal menampilkan dua jalur, tetapi rincian lengkap syarat tiap jalur tidak tersedia di halaman publik yang diperiksa. Pengumuman resmi juga mengubah dokumen jalur prestasi menjadi surat keterangan prestasi dari kampus; periksa aturan terbaru sebelum mendaftar.
