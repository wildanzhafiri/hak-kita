id: beasiswa-gunung-mas-2026
nama: Beasiswa Mahasiswa Keluarga Tidak Mampu Gunung Mas 2026
jenis: program
kategori: Beasiswa
penyelenggara: Bagian Kesejahteraan Rakyat Sekretariat Daerah Kabupaten Gunung Mas
ringkasan: Bantuan beasiswa bagi mahasiswa asal Kabupaten Gunung Mas dari keluarga tidak mampu.
untuk:
  - Mahasiswa D3, D4, atau S1 asal Kabupaten Gunung Mas dari keluarga tidak mampu
manfaat:
  - Bantuan Biaya Pendidikan
jenjang:
  - Diploma
  - S1
cakupan:
  level: kabkota
  kode: '6210'
tipeGerbang: kategori
syarat:
  - teks: Memiliki IPK paling rendah 2,50 dan KTP serta KK wilayah Kabupaten Gunung Mas.
    sumberUrl: https://gunungmaskab.go.id/wp-content/uploads/2026/02/Pengumuman-Beasiswa-Pemkab-Gunung-Mas-2026.pdf
  - teks: Mahasiswa D3 duduk pada semester II sampai VI, sedangkan mahasiswa D4 atau S1 duduk pada semester II sampai IX saat mengajukan.
    sumberUrl: https://gunungmaskab.go.id/wp-content/uploads/2026/02/Pengumuman-Beasiswa-Pemkab-Gunung-Mas-2026.pdf
  - teks: Orang tua atau wali tidak mampu dengan status pekerjaan yang memenuhi batasan pada lampiran pengumuman resmi.
    sumberUrl: https://gunungmaskab.go.id/wp-content/uploads/2026/02/Pengumuman-Beasiswa-Pemkab-Gunung-Mas-2026.pdf
  - teks: Tidak sedang menerima beasiswa dari pihak lain dan menyiapkan surat keterangan tidak mampu sesuai ketentuan.
    sumberUrl: https://gunungmaskab.go.id/wp-content/uploads/2026/02/Pengumuman-Beasiswa-Pemkab-Gunung-Mas-2026.pdf
langkah:
  - "Lihat panduan pengisian di bit.ly/beasiswagumas2026 sebelum mengisi formulir."
  - "Isi formulir dan unggah pindaian bukti dukung asli di damon.gunungmaskab.go.id; pastikan dokumen terbaca jelas dan simpan screenshot Kode Tracking."
  - "Pantau status pengajuan di halaman tracking damon.gunungmaskab.go.id."
  - "Serahkan berkas fisik sebanyak 3 rangkap (1 asli dan 2 fotokopi), dijilid rapi sesuai urutan permohonan dengan cetakan screenshot Kode Tracking: langsung ke Bagian Kesejahteraan Rakyat Setda Kabupaten Gunung Mas pada jam kerja, atau kirim lewat ekspedisi atau pos ke Kantor Bupati Gunung Mas, Jln. Pangeran Diponegoro No. 02, Kuala Kurun."
  - "Pada periode 2026, pengajuan dibuka 1 Maret sampai 31 Mei 2026."
dokumen:
  - KTP dan KK wilayah Kabupaten Gunung Mas
  - Surat keterangan aktif kuliah, kartu mahasiswa, KRS, KHS, dan transkrip nilai
  - Surat keterangan tidak mampu serta surat pernyataan sesuai format resmi
  - Bukti rekening Bank Pembangunan Daerah Kalimantan Tengah atas nama pemohon
periode:
  buka: '2026-03-01'
  tutup: '2026-05-31'
sumberUtama:
  url: https://gunungmaskab.go.id/wp-content/uploads/2026/02/Pengumuman-Beasiswa-Pemkab-Gunung-Mas-2026.pdf
  jenis: situs-resmi
verifikasi: lengkap
tanggalDiperiksa: '2026-11-11'
catatan: Pendaftaran 2026 telah ditutup. Pengumuman menetapkan bantuan Rp8.000.000 per tahun dan memiliki 27 butir persyaratan; daftar dokumen di sini adalah ringkasan, sehingga lampiran resmi harus dibaca sebelum menyiapkan berkas periode berikutnya.
