catatan: Panduan ini untuk orang perseorangan dengan usaha mikro dan kecil. NIB tidak selalu menjadi satu-satunya persyaratan usaha; periksa izin dan standar tambahan sesuai tingkat risiko. Panduan tidak mencantumkan biaya.
tentang: "Kebutuhan izin dan standar tambahan mengikuti kegiatan serta tingkat risiko usaha."
