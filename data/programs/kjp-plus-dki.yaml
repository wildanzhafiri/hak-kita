catatan: Sumber utama baru berupa portal umum Pemprov DKI. Ganti dengan halaman resmi program yang spesifik saat diverifikasi. Nominal dan jadwal tahap sengaja tidak dicantumkan karena berbeda-beda antar sumber media.
