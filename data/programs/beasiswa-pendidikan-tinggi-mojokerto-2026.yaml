langkah:
  - "Daftar melalui beasiswa-disporapar.mojokertokota.go.id; pada periode 2026 pendaftaran dibuka 17 sampai 30 Agustus."
  - "Panitia melakukan seleksi administrasi berkas online dan menilai berkas jalur prestasi lomba (1 sampai 8 September 2026)."
  - "Hasil seleksi diumumkan sebagai perangkingan sesuai kuota tiap jalur (9 sampai 10 September 2026)."
  - "Mahasiswa yang lolos menyerahkan berkas fisik untuk diverifikasi (11 sampai 18 September 2026)."
  - "Calon penerima ditetapkan (21 sampai 22 September 2026) dan beasiswa diserahkan secara simbolis pada 28 Oktober 2026."
