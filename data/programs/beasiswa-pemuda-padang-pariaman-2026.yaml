ringkasan: Bantuan UKT bagi calon mahasiswa baru dan mahasiswa aktif berprestasi dari Kabupaten Padang Pariaman.
untuk:
  - Calon mahasiswa baru berprestasi asal Padang Pariaman
  - Mahasiswa aktif berprestasi asal Padang Pariaman
