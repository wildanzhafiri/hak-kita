  level: kabkota
  kode: '1305'
tipeGerbang: kategori
syarat:
  - teks: Calon mahasiswa jalur akademik memiliki prestasi akademik, atau jalur nonakademik memiliki prestasi di bidang yang diakui penyelenggara.
    sumberUrl: https://padangpariamankab.go.id/blog/berita_tampil/pemkab-padang-pariaman-buka-beasiswa-pemuda-berprestasi-2026-kesempatan-emas-kuliah-di-kampus-top-indonesia-dan-mesir-bupati-jka-ayo-daftar-segera
  - teks: Mahasiswa aktif memiliki IPK minimal 3,00 dan menunjukkan capaian prestasi.
    sumberUrl: https://padangpariamankab.go.id/blog/berita_tampil/pemkab-padang-pariaman-buka-beasiswa-pemuda-berprestasi-2026-kesempatan-emas-kuliah-di-kampus-top-indonesia-dan-mesir-bupati-jka-ayo-daftar-segera
langkah:
  - "Pastikan kategorimu: calon mahasiswa baru dengan prestasi akademik terbaik, atau mahasiswa aktif dengan IPK minimal 3,00 ditambah prestasi."
  - "Isi formulir online di s.id/formulirbeasiswa2026 dan unggah berkas di s.id/berkasbeasiswa2026, atau serahkan berkas langsung ke Bagian Kesejahteraan Rakyat Kantor Bupati Padang Pariaman, atau kirim lewat pos."
  - "Pada periode 2026, pendaftaran dibuka 11 Mei sampai 5 Juni, seleksi administrasi 8 sampai 12 Juni, dan hasilnya diumumkan 17 Juni."
