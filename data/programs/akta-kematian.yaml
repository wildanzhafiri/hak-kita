catatan: Tautan "Unduh Persyaratan" pada halaman sumber menuju berkas bernama formulirkelahiran.pdf; pastikan formulir yang dipakai untuk akta kematian. Rujukan ini khusus Sudin Dukcapil Jakarta Pusat. Untuk wilayah lain, periksa Dukcapil sesuai domisili. Halaman sumber tidak mencantumkan biaya maupun lama proses.
