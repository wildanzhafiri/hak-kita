cakupan:
  level: kabkota
  kode: "3171"
tipeGerbang: prosedur
syarat:
  - teks: Fotokopi surat kematian.
    sumberUrl: https://kependudukancapil.jakarta.go.id/sudin-jp/pelayanan/aktakematian
  - teks: "Satu bukti sesuai kondisi: surat keterangan dokter atau Kepala Desa/Lurah; surat kepolisian jika identitas tidak jelas; salinan penetapan pengadilan jika jenazah hilang atau tidak ditemukan; atau surat pernyataan maskapai jika hilang di udara."
    sumberUrl: https://kependudukancapil.jakarta.go.id/sudin-jp/pelayanan/aktakematian
langkah:
  - "Siapkan fotokopi surat kematian."
  - "Siapkan salah satu dokumen sesuai kondisi: surat keterangan dokter atau kepala desa/lurah; surat kepolisian jika identitas tidak jelas; salinan penetapan pengadilan jika jenazah hilang atau tidak ditemukan; atau surat pernyataan maskapai jika hilang di udara."
  - "Unduh dan isi Formulir Penerbitan Akta Kematian dari halaman Dukcapil Jakarta Pusat; contoh pengisian tersedia di halaman yang sama."
  - "Ajukan berkas ke layanan Dukcapil Jakarta Pusat di Kantor Walikota Jakarta Pusat; pertanyaan tentang alur dapat disampaikan ke WhatsApp Helpdesk 0813-9888-3171."
dokumen:
  - Fotokopi surat kematian
  - Bukti kematian sesuai kondisi
  - Formulir Penerbitan Akta Kematian
