catatan: Pendaftaran Angkatan II tahun 2026 telah ditutup. Syarat khusus bagi penduduk tidak mampu dan berprestasi merupakan prioritas seleksi, bukan pengganti syarat umum. Pelatihan berlangsung di Banjarbaru. Halaman sumber tidak merinci materi seleksi fisik serta dokumen daftar ulang; kontak umum Dinas Tenaga Kerja melalui telepon (0526) 2021037 atau email disnaker.tabalong@gmail.com.
