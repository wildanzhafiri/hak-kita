id: pelatihan-satpam-tabalong-2026
nama: Pelatihan Satpam Gada Pratama Tabalong 2026
jenis: program
kategori: Pekerjaan & Pelatihan
penyelenggara: Dinas Tenaga Kerja Kabupaten Tabalong
ringkasan: Pelatihan dan sertifikasi dasar satuan pengamanan bagi warga Kabupaten Tabalong.
untuk:
  - Warga Kabupaten Tabalong yang ingin bekerja di bidang pengamanan
manfaat:
  - Pelatihan & Pengembangan Keterampilan
cakupan:
  level: kabkota
  kode: '6309'
tipeGerbang: kategori
syarat:
  - teks: Ber-KTP Kabupaten Tabalong, berusia 18 sampai 35 tahun, dan tidak sedang bekerja saat mengikuti pelatihan.
    sumberUrl: https://smartnaker.tabalongkab.go.id/landing/detailpelatihan/478
  - teks: Berpendidikan minimal SLTA atau sederajat.
    sumberUrl: https://smartnaker.tabalongkab.go.id/landing/detailpelatihan/478
  - teks: Tinggi badan minimal 165 cm untuk pria atau 155 cm untuk wanita.
    sumberUrl: https://smartnaker.tabalongkab.go.id/landing/detailpelatihan/478
  - teks: Memiliki surat keterangan sehat dan tidak buta warna serta memenuhi ketentuan tato dan tindik pada pengumuman resmi.
    sumberUrl: https://smartnaker.tabalongkab.go.id/landing/detailpelatihan/478
langkah:
  - "Buka halaman pelatihan di smartnaker.tabalongkab.go.id dan pilih tombol pendaftaran."
  - "Langkah 1 dari 2: isi persyaratan (usia, ukuran baju dan sepatu, tinggi badan, nilai ijazah terakhir) dan unggah ijazah dengan transkrip nilai, foto berlatar merah, serta surat keterangan sehat dan tidak buta warna (PDF, DOC, DOCX, JPG, atau PNG, maksimal 2 MB)."
  - "Langkah 2 dari 2: baca tiga ketentuan, centang pernyataan persetujuan, lalu klik Daftar sekarang."
  - "Pada periode 2026: seleksi berkas 12 sampai 16 Oktober, seleksi fisik 18 sampai 20 Oktober, pengumuman 20 sampai 21 Oktober, daftar ulang peserta lulus 21 sampai 23 Oktober, lalu masuk asrama 25 Oktober dan pelatihan berlangsung sampai 8 November 2026."
dokumen:
  - KTP elektronik Kabupaten Tabalong
  - Ijazah terakhir dan transkrip nilai
  - Pas foto terbaru berlatar merah
  - Surat keterangan sehat dan tidak buta warna
  - SKCK jika sudah memiliki
periode:
  buka: '2026-10-05'
  tutup: '2026-10-16'
