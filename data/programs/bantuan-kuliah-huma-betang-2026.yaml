catatan: Pendaftaran 2026 berakhir 20 Juli. Portal masih menampilkan label Periode Aktif meskipun tanggal pendaftaran telah lewat; status terkini harus dikonfirmasi ke penyelenggara. Bantuan mengikuti alokasi dan ketentuan, bukan jaminan semua pendaftar menerima dana. Halaman sumber tidak menjelaskan prosedur perbaikan bila berkas ditolak.
