id: beasiswa-s3-aceh-timur-tengah
nama: Beasiswa S3 Timur Tengah Pemerintah Aceh 2026
jenis: program
kategori: Pendidikan
penyelenggara: Badan Pengembangan Sumber Daya Manusia Aceh
ringkasan: Beasiswa kerja sama bagi warga Aceh yang melanjutkan studi S3 di Timur Tengah.
untuk:
  - Calon mahasiswa doktoral asal Aceh
manfaat:
  - Bantuan Biaya Pendidikan
jenjang:
  - S3
cakupan:
  level: provinsi
  kode: '11'
tipeGerbang: kategori
syarat:
  - teks: Penduduk Aceh dan berdomisili paling singkat dua tahun di Aceh, dibuktikan dengan KTP dan/atau KK.
    sumberUrl: https://bpsdm.acehprov.go.id/media/2026.05/pengumuman_kepala_badan_beasiswa_2026_s3_timur_tengah1.pdf
  - teks: Berusia paling tinggi 50 tahun per Mei 2026 dan bersedia mengikuti seluruh tahapan seleksi.
    sumberUrl: https://bpsdm.acehprov.go.id/media/2026.05/pengumuman_kepala_badan_beasiswa_2026_s3_timur_tengah1.pdf
  - teks: Memiliki surat kesehatan jasmani, rohani, bebas narkoba, dan surat berkelakuan baik sesuai ketentuan pengumuman.
    sumberUrl: https://bpsdm.acehprov.go.id/media/2026.05/pengumuman_kepala_badan_beasiswa_2026_s3_timur_tengah1.pdf
  - teks: Memiliki surat penerimaan dari universitas di Timur Tengah pada bidang tafsir, hadis, filsafat, atau fikih, serta sertifikat TOAFL minimal 500 atau setara.
    sumberUrl: https://bpsdm.acehprov.go.id/media/2026.05/pengumuman_kepala_badan_beasiswa_2026_s3_timur_tengah1.pdf
  - teks: Memiliki rekomendasi pimpinan dayah atau pesantren terakreditasi di Aceh dan menandatangani pakta integritas pengabdian setelah studi.
    sumberUrl: https://bpsdm.acehprov.go.id/media/2026.05/pengumuman_kepala_badan_beasiswa_2026_s3_timur_tengah1.pdf
langkah:
  - "Daftar online lewat formulir pendaftaran yang ditautkan di pengumuman BPSDM Aceh; pada seleksi 2026 pendaftaran dibuka 13 Mei sampai 9 Juni 2026 dan sudah ditutup."
  - "Unggah berkas: pas foto 4x6, scan KTP, KK, surat kesehatan jasmani, surat kesehatan rohani, surat bebas narkoba, SKCK, surat pernyataan, dan ijazah terakhir (digabung dalam satu berkas PDF), serta LOA, sertifikat TOAFL, rekomendasi pimpinan dayah atau pesantren di Aceh, dan pakta integritas."
  - "Cetak bukti pendaftaran yang dikirim ke email; bawa saat tes dan lampirkan saat pendaftaran ulang sebagai penerima."
  - "Ikuti seleksi administrasi, lalu TPA dan wawancara (17 Juni 2026 pada seleksi 2026)."
  - "Penerima yang lulus mendaftar ulang dan menyerahkan dokumen asli. Pertanyaan pendaftaran dapat dikirim ke pokja1bidkerjasama@gmail.com."
