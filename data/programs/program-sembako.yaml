langkah:
  - Periksa informasi sasaran bantuan melalui situs resmi Cek Bansos Kemensos.
  - Jika data kesejahteraan tidak sesuai, ajukan pemutakhiran melalui desa atau kelurahan dan dinas sosial, atau gunakan aplikasi Cek Bansos resmi.
  - Pantau hasil pemutakhiran dan penetapan penerima melalui kanal resmi pemerintah.
