syarat:
  - teks: Menyiapkan nomor KK untuk memulai pendaftaran peserta baru di Mobile JKN.
    sumberUrl: https://bpjs-kesehatan.go.id/user-manual-mobile-jkn/administrasi%20JKN.html
  - teks: Menyiapkan alamat email dan nomor ponsel aktif untuk verifikasi pendaftaran.
    sumberUrl: https://bpjs-kesehatan.go.id/user-manual-mobile-jkn/administrasi%20JKN.html
langkah:
  - "Di beranda Mobile JKN, pilih menu pendaftaran peserta baru."
  - "Baca syarat dan ketentuan BPJS Kesehatan, lalu lanjutkan."
  - "Masukkan nomor KK dan captcha, lalu lanjut dan pilih tambah."
  - "Isi formulir pendaftaran dengan teliti, lalu simpan."
  - "Pilih kelas rawat inap; sistem menampilkan iuran per jiwa dan iuran satu keluarga."
  - "Masukkan email dan nomor telepon, lalu masukkan kode OTP yang dikirim ke ponsel dan verifikasi."
  - "Baca dengan teliti halaman persetujuan peserta, lalu lanjutkan."
  - "Setelah pendaftaran berhasil, informasi virtual account untuk pembayaran iuran dikirim ke email terdaftar dan terhubung dengan Mobile JKN."
